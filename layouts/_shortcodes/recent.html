{{- /* {{< recent >}}: pages by last change, as RecentChanges did */ -}}
{{- $n := default 100 (.Get 0) -}}
<ul class="texwiki-recent">
{{- range first $n (sort (.Site.RegularPages | append .Site.Sections) "Lastmod" "desc") }}
  <li><time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Lastmod.Format "2006-01-02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{- end }}
</ul>
